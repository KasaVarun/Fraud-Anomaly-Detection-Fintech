[project]
name = "fraud-anomaly-detection"
version = "0.1.0"
description = "Fraud and anomaly detection network foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "azure-cosmos==4.17.1",
    "azure-identity==1.25.1",
    "azure-storage-blob==12.27.1",
    "fastapi>=0.115,<1",
    "gremlinpython==3.8.2",
    "networkx==3.7",
    "numpy==2.5.4",
    "polars>=1.36,<2",
    "pyarrow==26.0.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "sentence-transformers==6.2.0",
    "torch==2.15.0",
    "transformers==5.22.1",
    "uvicorn[standard]>=0.32,<1",
    "lightgbm==4.6.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "pandas==2.3.3",
    "pyjwt[crypto]==2.14.0",
]

[project.scripts]
fraud-ingest = "fraud_detection.ingestion.cli:main"
fraud-model = "fraud_detection.modeling.cli:main"
fraud-incremental = "fraud_detection.incremental.cli:main"
fraud-reporting-contracts = "fraud_detection.reporting.cli:main"
fraud-deploy = "fraud_detection.deployment.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
    "types-networkx==3.6.1.20261029",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "schema: fast relational metadata contract tests",
    "integration: requires a dedicated local PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["fraud_detection"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "gremlin_python.*",
    "joblib.*",
    "pandas.*",
    "pyarrow.*",
    "sentence_transformers.*",
    "sklearn.*",
]
ignore_missing_imports = true

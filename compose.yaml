services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fraud_detection_dev
      POSTGRES_USER: fraud_dev
      POSTGRES_PASSWORD: fraud_dev_local_only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_dev -d fraud_detection_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
    name: fraud_anomaly_detection_postgres_data
